{% if page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between mt-6 text-sm">
    <p class="text-gray-500 dark:text-gray-400">
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </p>
    <div class="flex gap-2">
        {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="px-3 py-1 border rounded-md hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-gray-800 transition">Previous</a>
        {% endif %}
        {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="px-3 py-1 border rounded-md hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-gray-800 transition">Next</a>
        {% endif %}
    </div>
</div>
{% endif %}
